services:
  jetracer:
    # Deployment definition: only immutable image content and runtime
    # resources. Override the repository/tag when publishing a release to a
    # different registry or pinning a rollback build.
    image: ${JETRACER_IMAGE:-ghcr.io/escher-bach/jetracer-ros2}:${JETRACER_TAG:-latest}
    pull_policy: always
    container_name: my_jetracer
    network_mode: "host"
    ipc: "host"
    pid: "host"
    privileged: true
    security_opt:
      - seccomp:unconfined
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      RMF_START_DOCK: ${RMF_START_DOCK:-MANUAL}
      DOCK_TABLE: /opt/jetracer/config/docks.yaml
    volumes:
      # Camera producer runs in the host namespaces and exchanges frames over
      # this shared socket path.
      - /tmp:/tmp
      # Mutable state survives container and release replacement without a
      # repository checkout on the device.
      - jetracer-rtabmap:/data/rtabmap
      - jetracer-models:/data/models
      # JetPack 4.5 compute-slice mounts. These are device runtime resources,
      # not application files; the target compatibility check must ensure they
      # exist before deployment.
      - /usr/local/cuda-10.2:/usr/local/cuda-10.2:ro
      - /usr/lib/aarch64-linux-gnu/tegra:/usr/lib/aarch64-linux-gnu/tegra:ro
      - /usr/lib/aarch64-linux-gnu:/hostlib:ro
      - /usr/src/tensorrt:/usr/src/tensorrt:ro
      - /usr/include:/hostinclude:ro
    devices:
      - /dev/ttyACM0:/dev/ttyACM0
      - /dev/ttyACM1:/dev/ttyACM1
      - /dev/input:/dev/input
    command:
      - ros2
      - launch
      - jetracer_ros2
      - camera_slam_nav_launch.py
    restart: unless-stopped

  zenoh-bridge:
    image: ${ZENOH_IMAGE:-ghcr.io/escher-bach/jetracer-zenoh}:${JETRACER_TAG:-latest}
    pull_policy: always
    container_name: my_jetracer_zenoh
    network_mode: "host"
    # Required on JetPack 4.5's older libseccomp/runc combination.
    security_opt:
      - seccomp:unconfined
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      ROS_DISTRO: humble
    command:
      - client
      - -c
      - /etc/zenoh/bridge_client.json5
      - -n
      - ${ROBOT_NAMESPACE:-/bot1}
      - -e
      - tcp/${ROUTER_IP:-192.168.0.142}:7447
    restart: unless-stopped

volumes:
  jetracer-rtabmap:
    name: ${RTABMAP_VOLUME:-jetracer-rtabmap}
  jetracer-models:
    name: ${MODELS_VOLUME:-jetracer-models}
