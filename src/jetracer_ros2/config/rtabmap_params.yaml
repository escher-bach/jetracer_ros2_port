# RTAB-Map: lidar SLAM with visual (mono camera) loop-closure detection.
# Parameter policy (see RTABMAP.md §4, in ../jetracer_ros2_port_documentation/): only required / upstream-standard /
# repo-proven / embedded-performance values are set. Everything else stays at
# default and is tuned symptom-first, one knob at a time (RTABMAP.md §6).
rtabmap:
  ros__parameters:
    # ---- REQUIRED: topology / plumbing ----
    frame_id: base_footprint
    subscribe_rgb: true          # mono camera: RGB without depth
    subscribe_depth: false
    subscribe_scan: true
    qos_scan: 2                  # sllidar publishes BEST_EFFORT; without this
                                 # the scan subscription gets no data
    database_path: /data/rtabmap/rtabmap.db   # docker-compose volume

    # RTAB-Map library params below are STRING parameters — keep the quotes.

    # ---- REQUIRED: mono camera cannot compute transforms ----
    Reg/Strategy: "1"            # ICP: camera detects loops, scan computes
                                 # the transform (no depth available)
    Grid/Sensor: "0"             # grid from scan; default (1) expects a depth camera
    RGBD/LoopClosureIdentityGuess: "true"   # skip the visual transform-guess stage:
                                 # mono nodes have no 3D features, so it rejects
                                 # every closure ("Not enough features, old=0");
                                 # identity guess hands the job straight to scan ICP

    # ---- STANDARD: upstream 2D-lidar reference config (TurtleBot3 demo) ----
    Reg/Force3DoF: "true"                   # ground vehicle, 2D
    RGBD/NeighborLinkRefining: "true"       # refine odom links with scan ICP
    RGBD/ProximityBySpace: "true"           # scan-based proximity re-localization
    RGBD/ProximityPathMaxNeighbors: "10"    # default 0 = scan proximity off

    # ---- PROVEN IN THIS REPO ----
    Grid/RangeMax: "8.0"         # = max_laser_range in slam_toolbox_params.yaml

    # ---- LOOP-CLOSURE GATES: relaxed for sparse A1 scans + drifty wheel/IMU odom ----
    # These let camera-detected + ICP-computed loops actually land (the only
    # mechanism that heals an odometry yaw jump / "ghost lab"). Both defaults are
    # calibrated for dense-scan desktop sensors; see RTABMAP.md §6.3/§6.4.
    Icp/MaxTranslation: "0.4"    # default 0.2; A1 drift at loop time exceeds 20 cm,
                                 # so the cap was rejecting correct corrections
    RGBD/OptimizeMaxError: "4.0" # default 3.0; sparse-scan ICP reports an
                                 # overconfident covariance, inflating the error
                                 # ratio on CORRECT closures (observed abs err ~1.4 deg
                                 # rejected at ratio 4.29). Still guards true ghosts
                                 # (those error by tens of degrees).
    Icp/CorrespondenceRatio: "0.06"   # default 0.10; A1 scans repeatedly measured
                                 # 0.055-0.092 overlap on otherwise-valid geometry,
                                 # all rejected as "Cannot compute transform". Risk:
                                 # sparser overlap makes ICP more likely to converge
                                 # on ambiguous geometry (corridors, symmetric rooms) —
                                 # relies on MaxTranslation/OptimizeMaxError to catch
                                 # a bad one downstream.

    # ---- EMBEDDED PERFORMANCE (upstream RPi/Jetson guidance; defaults assume desktop) ----
    Rtabmap/TimeThr: "700"       # ms; bounds map-update time via WM->LTM transfer
    Kp/MaxFeatures: "200"        # BoW features per image (default 500)
    # Kp/DetectorStrategy left at default (GFTT+ORB): BRIEF needs OpenCV
    # xfeatures2d, which the Humble binaries lack — setting "6" just logs
    # warnings and falls back to the default anyway (verified on-robot).
