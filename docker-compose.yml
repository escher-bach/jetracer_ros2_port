version: '3.8'

services:
  jetracer:
    # Prebuilt by .github/workflows/build-image.yml on a native arm64 runner.
    # Normal path on the robot is `docker compose pull` — the digest comparison
    # is the "is it outdated?" check, so the Nano never runs rosdep itself.
    # Pin to a rollback build with e.g. JETRACER_TAG=sha-1a2b3c4.
    image: ghcr.io/escher-bach/jetracer-ros2:${JETRACER_TAG:-latest}
    pull_policy: always
    # Escape hatch: `docker compose build` still works on the robot, and
    # cache_from means even that pulls the rosdep layer instead of resolving it.
    build:
      context: .
      dockerfile: Dockerfile
      cache_from:
        - ghcr.io/escher-bach/jetracer-ros2:buildcache
    container_name: my_jetracer
    network_mode: "host"
    ipc: "host"
    pid: "host"
    privileged: true
    security_opt:
      - seccomp:unconfined
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    volumes:
      - /tmp:/tmp
      # RTAB-Map database (the map) persisted across container restarts
      - ./maps/rtabmap:/data/rtabmap
      # Segmentation model + TensorRT engine cache (engines are device- and
      # TRT-version-specific; built on first launch by ensure_model.sh)
      - ./models:/data/models
      # Phase 1: jetracer_segmentation colcon-builds INSIDE the running
      # container (its GPU deps are the runtime mounts below, absent at
      # docker build); also shadows the image's COLCON_IGNORE marker
      - ./src/jetracer_segmentation:/ros2_ws/src/jetracer_segmentation
      # --- GPU: native CUDA 10.2 via compute-slice bind mounts (validated by
      # jetson_cuda_experiment H0-H5; no nvidia runtime on purpose - the csv
      # runtime would also mount bionic GStreamer/EGL libs over jammy's own).
      # Device nodes (/dev/nvhost-*, /dev/nvmap) come from privileged: true.
      - /usr/local/cuda-10.2:/usr/local/cuda-10.2:ro
      - /usr/lib/aarch64-linux-gnu/tegra:/usr/lib/aarch64-linux-gnu/tegra:ro
      # Host lib pantry: NOT on the linker path; entrypoint symlinks only the
      # compute libs (cublas/cudnn/nvinfer) out of it into /opt/nvlinks
      - /usr/lib/aarch64-linux-gnu:/hostlib:ro
      # trtexec + sample data, for one-shot TensorRT engine building
      - /usr/src/tensorrt:/usr/src/tensorrt:ro
      # Host include pantry (TRT NvInfer*.h + cuDNN headers). NEVER mount it
      # in place - it also holds bionic glibc headers; the entrypoint symlinks
      # only Nv*/cudnn* into the container's standard include dir.
      - /usr/include:/hostinclude:ro
      # Optional: Mount source code for active development instead of using the copied version
      # - ./src/jetracer_ros2:/ros2_ws/src/jetracer_ros2
    devices:
      - /dev/ttyACM0:/dev/ttyACM0
      - /dev/ttyACM1:/dev/ttyACM1
      - /dev/input:/dev/input
    # Adjust the command to run your specific launch file
    #command: bash -c "ros2 launch jetracer_ros2 jetracer.launch.py"
    tty: true
    stdin_open: true

  zenoh-bridge:
    # Pinned, not :latest — an unpinned tag means two robots silently run
    # different bridges depending on when each last pulled. 1.9.0 is what
    # :latest resolved to as of 2026-07-27.
    image: eclipse/zenoh-bridge-ros2dds:1.9.0
    container_name: my_jetracer_zenoh
    network_mode: "host"
    # JetPack 4.5 ships libseccomp 2.4.x, which predates clone3. Docker's
    # default profile pairs a clone3 ERRNO(ENOSYS) rule with an ERRNO(EPERM)
    # default; this runc collapses both to plain SCMP_ACT_ERRNO and libseccomp
    # rejects the rule as redundant, so the container never starts. The
    # jetracer service dodges this via privileged + unconfined already.
    security_opt:
      - seccomp:unconfined
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - ROS_DISTRO=humble
    command: -n ${ROBOT_NAMESPACE:-/bot1}
